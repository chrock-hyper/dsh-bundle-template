name: ci

# Optional. Copy this file to .github/workflows/ci.yml to enable it.
# The template does not enable GitHub Actions by default.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts: the root `prepare` builds, and the steps below do
      # that explicitly so a build failure is not mistaken for an install
      # failure.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack:check
